# FiscalGuard: Hadoop (HDFS) + Spark + Kafka (+ YARN, Airflow y MongoDB local opcionales)
# Uso:  docker compose up -d                          núcleo (MongoDB Atlas como capa de servicio)
#       docker compose --profile yarn up -d           + YARN (ResourceManager/NodeManager) para la comparativa MapReduce
#       docker compose --profile airflow up -d        + Apache Airflow (orquestación de los jobs batch)
#       docker compose --profile local-mongo up -d    + Mongo local para desarrollo
name: fiscalguard

services:
  # ---------- Data Lake: HDFS ----------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=fiscalguard
    env_file: ./hadoop.env
    ports:
      - "9870:9870"   # UI web HDFS
      - "9000:9000"   # RPC
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./data:/data

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: ./hadoop.env
    volumes:
      - hdfs_dn1:/hadoop/dfs/data
    depends_on: [namenode]

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: ./hadoop.env
    volumes:
      - hdfs_dn2:/hadoop/dfs/data
    depends_on: [namenode]

  # ---------- Procesamiento: Spark (standalone en dev; YARN en fase posterior) ----------
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark_jobs:/opt/jobs
      - ./data:/data

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081"
    depends_on: [spark-master]

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8082:8081"
    depends_on: [spark-master]

  # ---------- Mensajería: Kafka (KRaft, un solo nodo) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"   # acceso desde el host (productores locales)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---------- Capa de servicio local (opcional; en producción: MongoDB Atlas M0) ----------
  mongo:
    image: mongo:7
    container_name: mongo
    profiles: ["local-mongo"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---------- Fase 5: YARN para MapReduce (perfil "yarn") ----------
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    profiles: ["yarn"]
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode1:9864 datanode2:9864"
    env_file: [./hadoop.env, ./hadoop-yarn.env]
    ports:
      - "8088:8088"   # UI web de YARN
    volumes:
      - ./mapreduce:/mapreduce
    depends_on: [namenode, datanode1, datanode2]

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    profiles: ["yarn"]
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode1:9864 resourcemanager:8088"
    env_file: [./hadoop.env, ./hadoop-yarn.env]
    depends_on: [resourcemanager]

  # ---------- Fase 5: orquestación con Apache Airflow (perfil "airflow") ----------
  # Modo standalone (SQLite + SequentialExecutor): suficiente para un DAG de desarrollo.
  # Ejecuta los jobs DENTRO de spark-master a través del socket de Docker.
  airflow:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow
    profiles: ["airflow"]
    command: standalone
    user: "0:0"   # necesario para usar /var/run/docker.sock en Docker Desktop
    env_file:
      - path: ./.env      # aquí está MONGO_URI (la misma que usa la API)
        required: false
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Mexico_City
    ports:
      - "8090:8080"   # UI de Airflow (el 8080 ya lo usa spark-master)
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_home:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [spark-master]

volumes:
  hdfs_namenode:
  hdfs_dn1:
  hdfs_dn2:
  mongo_data:
  airflow_home:
